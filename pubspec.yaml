name: speedotrack
description: Speedotrack GPS based tracking solution.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  simple_animations: ^5.2.0
  google_maps_flutter: ^2.12.3
  overlay_support:  ^2.1.0
  font_awesome_flutter: ^10.10.0
  progress_indicators: ^1.0.0
  video_player: ^2.10.0
  image: ^4.5.4
  #auto_size_text: ^3.0.0
  url_launcher: ^6.3.2
  liquid_pull_to_refresh: ^3.0.1
  fl_chart: ^1.0.0
  intl: ^0.20.2
  extended_image: ^10.0.1
  rflutter_alert: ^2.0.7
  webview_flutter: ^4.13.0
  stack: ^0.2.2
  location: ^8.0.1
  #flutter_animarker: ^3.2.0
  audioplayers: ^6.1.0
  #chewie: ^1.8.5
  #chewie: ^0.9.10
  firebase_messaging: ^16.0.0
  #  foreground_service: ^2.0.1+1
  fluttertoast: ^8.2.12
  shimmer: ^3.0.0
  flutter_local_notifications: ^19.4.0
  http: 1.2.2
  requests: ^4.7.0
  in_app_update: ^4.2.3
  custom_progress_button: ^2.0.1
  progress_dialog_null_safe: ^3.1.0
  latlong2: ^0.9.1
  credential_manager: 1.0.4+1
  curved_navigation_bar: ^1.0.6
  cached_network_image:
  flutter_bloc: ^9.1.1
  permission_handler:
  share_plus: ^11.1.0
  animations: ^2.0.11
  provider: ^6.1.5
  restart_app: ^1.3.2
  flutter_rounded_date_picker: ^3.0.4
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^8.3.1
  get: ^4.7.2
  flutter_svg: ^2.2.0
  supercharged:
  auto_size_text:
  geocoding:
  flutter_speedometer_new:
  video_player_android: ^2.8.12

dependency_overrides:
  http: 0.13.4
  json_utilities: ^0.1.3
  json_annotation:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/audios/
    - assets/logo.mp4
    - assets/antenna.png
    - assets/appsicon/appIcon.png
    - assets/appsicon/icon.png
    - assets/battery.png
    - assets/car.png
    - assets/electricbatery.png
    - assets/power.png
    - assets/sattelite.png
    - assets/sensor.png
    - assets/speedometer.png
    - images/
    - images/km_summary.png
    - images/playback.png

  fonts:
    - family: Digital-Display
      fonts:
        - asset: fonts/Digital-Display.ttf
    - family: Montserrat-Regular
      fonts:
        - asset: fonts/Montserrat/Montserrat-Regular.ttf
    - family: Neucha-Regular
      fonts:
        - asset: fonts/Neucha/Neucha-Regular.ttf
    - family: Philosopher-Regular
      fonts:
        - asset: fonts/Philosopher/Philosopher-Regular.ttf
    - family: Sacramento-Regular
      fonts:
        - asset: fonts/Sacramento/Sacramento-Regular.ttf
    - family: UbuntuMono-Regular
      fonts:
        - asset: fonts/Ubuntu_Mono/UbuntuMono-Regular.ttf
    - family: YesevaOne-Regular
      fonts:
        - asset: fonts/Yeseva_One/YesevaOne-Regular.ttf
